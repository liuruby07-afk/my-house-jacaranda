<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ef">
  <title>My house——蓝花楹</title>
  <style>:root {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  font-synthesis: style;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  --title: #383544;
  --subtitle: #655b73;
  --control: #5a5366;
  --selected: #585062;
  --selected-ink: #fffaf8;
  --panel: rgb(250 249 248 / 80%);
  --hairline: rgb(90 78 99 / 16%);
  background: #f4f2ef;
}
body[data-time="dusk"] {
  --title: #513338;
  --subtitle: #795450;
  --control: #6d5155;
  --selected: #71535b;
  --panel: rgb(250 238 230 / 83%);
  --hairline: rgb(109 79 78 / 17%);
}
body[data-time="night"] {
  --title: #f3eaf8;
  --subtitle: #c7bedb;
  --control: #d4ccdf;
  --selected: #d6c9e4;
  --selected-ink: #353246;
  --panel: rgb(43 44 63 / 85%);
  --hairline: rgb(224 211 240 / 20%);
}
.gallery {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
}
.sky, .sky::before, .sky::after { position: absolute; inset: 0; pointer-events: none; }
.sky { background: radial-gradient(ellipse at 52% 57%, #e7e4ed 0%, #efeff1 45%, #f7f4ef 90%); }
.sky::before, .sky::after { content: ""; opacity: 0; transition: opacity 1.25s ease-in-out; }
.sky::before { background: radial-gradient(ellipse at 52% 57%, #e5c8ca 0%, #ecdee4 46%, #f7eee4 90%); }
.sky::after { background: radial-gradient(ellipse at 52% 53%, #44465f 0%, #34384f 45%, #252b40 92%); }
body[data-time="dusk"] .sky::before, body[data-time="night"] .sky::after { opacity: 1; }
.caption {
  position: absolute;
  z-index: 2;
  left: max(clamp(22px, 4.4vw, 78px), env(safe-area-inset-left));
  top: max(clamp(20px, 4.8vh, 60px), env(safe-area-inset-top));
  pointer-events: none;
}
.caption h1, .caption p { margin: 0; font-weight: 400; transition: color 1.25s ease-in-out; }
.caption h1 {
  font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
  font-size: clamp(26px, 2.65vw, 46px);
  letter-spacing: .016em;
  line-height: 1.23;
  color: var(--title);
  white-space: nowrap;
}
.caption p {
  margin: 7px 0 0 1px;
  font-family: "Baskerville", "Georgia", serif;
  font-style: italic;
  font-size: clamp(16px, 1.35vw, 22px);
  line-height: 1.25;
  color: var(--subtitle);
}
#scene {
  position: absolute;
  inset: 7% 0 10%;
  outline: none;
  cursor: grab;
  touch-action: none;
}
#scene:active { cursor: grabbing; }
#scene:focus-visible { outline: 1px dashed var(--subtitle); outline-offset: -4px; }
#scene canvas { display: block; width: 100%; height: 100%; }
.controls {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: max(clamp(12px, 3.2vh, 42px), env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  max-width: calc(100% - 16px);
  padding: 3px;
  border: 1px solid var(--hairline);
  border-radius: 32px;
  background-color: var(--panel);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  transition: background-color 1.25s, border-color 1.25s;
}
.button-group { display: flex; }
.divider { width: 1px; height: 18px; margin: 0 4px; background: var(--hairline); }
button {
  display: grid;
  place-items: center;
  width: clamp(35px, 5.5vmin, 46px);
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 24px;
  background: transparent;
  color: var(--control);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .7s, background-color .35s;
}
button[aria-pressed="true"] { color: var(--selected-ink); background-color: var(--selected); }
button:focus-visible { outline: 2px solid var(--title); outline-offset: 1px; }
@media (hover: hover) { button:not([aria-pressed="true"]):hover { background: var(--hairline); } }
button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#loading, #fallback { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
#loading {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid var(--hairline); border-top-color: var(--subtitle);
  pointer-events: none; animation: loading .8s linear infinite;
}
#loading.done, [hidden] { display: none !important; }
#fallback { margin: 0; color: var(--title); width: min(90%, 360px); text-align: center; font-size: 15px; }
@keyframes loading { to { transform: translate(-50%,-50%) rotate(360deg); } }
@media (max-width: 650px) and (orientation: portrait) {
  #scene { inset: max(108px, 13%) 0 max(72px, 9%); }
  button { width: clamp(36px, 11vw, 44px); }
}
@media (max-height: 480px) and (orientation: landscape) {
  .caption { top: max(12px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); }
  .caption h1 { font-size: 23px; }
  .caption p { margin-top: 3px; font-size: 14px; }
  #scene { inset: 0 0 42px; }
  .controls { bottom: max(5px, env(safe-area-inset-bottom)); }
  button { height: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-time="day">
  <main class="gallery">
    <div class="sky" aria-hidden="true"></div>
    <header class="caption">
      <h1>My house——蓝花楹</h1>
      <p lang="en">My house-- Blue Jasmine</p>
    </header>
    <div id="scene" role="application" tabindex="0" aria-label="蓝花楹三维街角。拖动旋转，滚轮或双指缩放，点击花冠落花。方向键旋转，加减键缩放，R 键复位。">
      <div id="loading" role="status" aria-label="正在载入场景"></div>
      <p id="fallback" role="alert" hidden>请使用支持 WebGL 2 的浏览器，并开启硬件加速。</p>

    <div class="controls" aria-label="场景操作" role="group">
      <div class="button-group" role="group" aria-label="时段">
        <button type="button" class="time" data-mode="day" aria-pressed="true" aria-label="白天">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        <button type="button" class="time" data-mode="dusk" aria-pressed="false" aria-label="黄昏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15.5h18M5.5 19h13M7.4 15.5a4.6 4.6 0 0 1 9.2 0M12 4v2.5M4.2 8.2l1.8 1.7m12 0 1.8-1.7"/></svg>
        </button>
        <button type="button" class="time" data-mode="night" aria-pressed="false" aria-label="夜晚">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.7 15.4A8.4 8.4 0 0 1 8.6 4.3a8.4 8.4 0 1 0 11.1 11.1Z"/></svg>
        </button>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="button-group" role="group" aria-label="花雨和视角">
        <button type="button" id="petals" aria-label="落一阵花雨">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13.5C4 11.5 5.6 5.2 12.5 4.1c1.1 6.1-.6 9.7-4.5 9.4Zm-.9 4.8c.2-3.2 1.4-6.5 3-9M15.5 19.6c-.2-3.1 1.8-5.8 5.3-6.8.1 4-1.2 6.5-5.3 6.8Z"/></svg>
        </button>
        <button type="button" id="zoom-out" aria-label="缩小"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <button type="button" id="zoom-in" aria-label="放大"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
        <button type="button" id="reset" aria-label="复位视角"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10.5a7.5 7.5 0 1 1 .8 5.6M4.5 5.5v5.2h5.2"/></svg></button>
      </div>
    </div>
  </main>
